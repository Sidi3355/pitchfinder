name: Fetch venue facts

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: venue-fetch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Read the operators' club pages (polite, cached)
        run: node scripts/fetch-venues.mjs
      - name: Read the slot calendars for prices (Pitchbooking, Playfinder; polite, cached)
        run: node scripts/fetch-slots.mjs
        continue-on-error: true
      - name: Commit and push if changed
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          git config user.name "pitchfinder-data-bot"
          git config user.email "actions@users.noreply.github.com"
          OUTPUTS="data/venues-live.json data/slots-live.json data/cache/pages data/cache/probe data/cache/playfinder data/cache/pitchbooking data/cache/venue-postcodes.json"
          STAGE="$(mktemp -d)"
          for p in $OUTPUTS; do
            if [ -e "$p" ]; then mkdir -p "$STAGE/$(dirname "$p")" && cp -r "$p" "$STAGE/$p"; fi
          done
          git fetch origin "$BRANCH"
          git reset -q --hard FETCH_HEAD
          for p in $OUTPUTS; do
            if [ -e "$STAGE/$p" ]; then mkdir -p "$(dirname "$p")" && rm -rf "$p" && cp -r "$STAGE/$p" "$p"; fi
          done
          for p in $OUTPUTS; do [ -e "$p" ] && git add "$p"; done
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh operator venue facts and slot prices"
            git push origin "HEAD:$BRANCH"
          fi
