name: Refresh pitch data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1' # weekly, Monday 04:17 UTC

permissions:
  contents: write

concurrency:
  group: data-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scrape venue prices (best-effort, cached, polite)
        run: node scripts/scrape-prices.mjs
        continue-on-error: true
      - name: Build pitch dataset from OpenStreetMap (with geocoding caches)
        run: node scripts/build-data.mjs
        env:
          NOMINATIM_MAX: '1500'
      - name: Audit data quality (checks booking URLs and coordinates)
        run: node scripts/audit-data.mjs
        continue-on-error: true
      - name: Commit and push if changed
        run: |
          git config user.name "pitchfinder-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data data/prices.json data/cache data/audit-history.json agent/DATA_QUALITY.md
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Refresh pitch dataset, geocoding caches and data quality report"
            # The branch may have moved while this ran: replay the data commit on top.
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && break
              echo "push attempt $attempt failed, retrying"
              sleep 10
            done
          fi
