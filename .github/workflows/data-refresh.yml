name: Refresh pitch data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1' # weekly, Monday 04:17 UTC

permissions:
  contents: write

concurrency:
  group: data-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Read the operators' club pages (best-effort, cached, polite)
        run: node scripts/fetch-venues.mjs
        continue-on-error: true
      - name: Scrape venue prices (best-effort, cached, polite)
        run: node scripts/scrape-prices.mjs
        continue-on-error: true
      - name: Build pitch dataset from OpenStreetMap (with geocoding caches)
        run: node scripts/build-data.mjs
        env:
          NOMINATIM_MAX: '1500'
      - name: Audit data quality (checks booking URLs and coordinates)
        run: node scripts/audit-data.mjs --write
        continue-on-error: true
      - name: Commit and push if changed
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          git config user.name "pitchfinder-data-bot"
          git config user.email "actions@users.noreply.github.com"
          OUTPUTS="public/data data/prices.json data/venues-live.json data/cache data/audit-history.json agent/DATA_QUALITY.md"
          # The refresh takes a quarter of an hour and the branch may have moved.
          # Generated files are copied aside, the branch is reset to the remote
          # head, and the files are put back on top: no merge, no conflicts.
          STAGE="$(mktemp -d)"
          for p in $OUTPUTS; do
            if [ -e "$p" ]; then mkdir -p "$STAGE/$(dirname "$p")" && cp -r "$p" "$STAGE/$p"; fi
          done
          git fetch origin "$BRANCH"
          git reset -q --hard FETCH_HEAD
          for p in $OUTPUTS; do
            if [ -e "$STAGE/$p" ]; then mkdir -p "$(dirname "$p")" && rm -rf "$p" && cp -r "$STAGE/$p" "$p"; fi
          done
          for p in $OUTPUTS; do [ -e "$p" ] && git add "$p"; done
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Refresh pitch dataset, geocoding caches and data quality report"
            git push origin "HEAD:$BRANCH"
          fi
