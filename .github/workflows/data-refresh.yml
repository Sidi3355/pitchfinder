name: Refresh pitch data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1' # weekly, Monday 04:17 UTC

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scrape venue prices (best-effort)
        run: node scripts/scrape-prices.mjs
        continue-on-error: true
      - name: Build pitch dataset from OpenStreetMap
        run: node scripts/build-data.mjs
      - name: Commit and push if changed
        run: |
          git config user.name "pitchfinder-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data data/prices.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Refresh pitch dataset from OpenStreetMap"
            git push
          fi
